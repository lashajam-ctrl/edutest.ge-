name: Release gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Read the exact pnpm version from package.json; use its committed lockfile.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-gate.mjs --no-build
      - run: pnpm run build:cloudflare
