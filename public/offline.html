<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#5f3348"/>
  <title>კავშირი არ არის — EduTest.ge</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#fff3e7,#edf8f1);font-family:"Noto Sans Georgian",system-ui,sans-serif;color:#352a35}.card{width:min(520px,100%);padding:36px 28px;border:1px solid #eadbd2;border-radius:28px;background:rgba(255,253,249,.96);box-shadow:0 20px 55px rgba(75,49,69,.13);text-align:center}.icon{font-size:52px}h1{margin:12px 0 8px;font-size:26px}p{margin:0 auto 24px;max-width:390px;color:#716778;line-height:1.65}.button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:10px 22px;border-radius:14px;background:#5f3348;color:#fff;text-decoration:none;font-weight:800}.hint{display:block;margin-top:18px;font-size:12px;color:#8b7f86}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📶</div>
    <h1>ინტერნეტთან კავშირი შეწყდა</h1>
    <p>ტესტის პასუხები სერვერზე უსაფრთხოდ ინახება. კავშირის აღდგენის შემდეგ დაბრუნდით საიტზე და გააგრძელეთ შენახული ეტაპიდან.</p>
    <a class="button" href="/">ხელახლა ცდა</a>
    <span class="hint">EduTest.ge უსაფრთხოების მიზნით ტესტებს offline რეჟიმში არ აფასებს.</span>
  </main>
</body>
</html>
